 <!DOCTYPE html> 
<html>
    <head>
        <title>App</title>
    </head>
    <body>
       <button onclick="takeBack">Take me back!</button>
    </body>
    <script>
        function takeBack (){
            if(history.length <= 5){
                history.go(-(history.length-1));
            } else {
                history.go(-5);
            }
        }
    </script>
</html>
