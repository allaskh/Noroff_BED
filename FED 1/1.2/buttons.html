<!DOCTYPE html> 
<html>
    <head>
        <title>Buttons</title>
    </head>
    <body>
        <button onclick="window.location.href='https://youtube.com'; ">
            Welcome to Youtube!
        </button>
        <button onclick="redirecting()">    
        Here is another button.
        </button>
        <script>
            function redirecting() {
                alert("You can click the first one to go to the main YouTube page!");
            }
        </script>
    </body>
</html>
