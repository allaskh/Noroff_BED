<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">

     <div class="collapse navbar-collapse" id="navbarSupportedContent"> 
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <!-- TOAST --> 
         <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11"> 
          <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"> <div class="toast-header">
             <strong class="me-auto">Bootstrap</strong> <small>some mins ago</small> 
             <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"> </button> 
             </div> 
             <div class="toast-body"> Hello, world! This is a toast message. </div> 
             </div> 
        </div> 
        <h1>Here comes the carousel!</h1>
        <div id="carouselExampleControls" class="container p-5 carousel carousel-dark slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKRyzzog1DNrV7hpE6A8AZFb7yoyO3YMixsY9D_DZ9p3AfY2RKp4H9u8CL&s=10" class="d-block w-50" alt="Cute Dog 1">
        </div>
        <div class="carousel-item">
          <img src="https://plus.unsplash.com/premium_photo-1694819488591-a43907d1c5cc?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y3V0ZSUyMHB1cHBpZXN8ZW58MHx8MHx8fDA%3D" class="d-block w-50" alt="Cute Dog 2">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next end-50" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
  </div>
  <h1>Here is button group!</h1>
  <div class="btn-group-vertical ms-5" role="group" aria-label="Vertical button group">
  <button type="button" class="btn btn-primary">Button 1</button>
  <button type="button" class="btn btn-secondary">Button 2</button>
  <button type="button" class="btn btn-danger">Button 3</button>
</div>
   <script src="jquery-3.6.0.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
  <script> 
  $("#liveToastBtn").click(function() { 
    const toastElement = document.getElementById("liveToast"); 
    const toast = new bootstrap.Toast(toastElement); 
    toast.show(); 
    }); 
    </script>
