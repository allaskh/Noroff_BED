 <!DOCTYPE html> 
<html>
    <head>
        <title>App</title>
    </head>
    <body>
       <p id="p1">One paragraph</p>
       <p id="p2">Second paragraph </p>
       <p id="p3">Third paragraph</p>

    </body>
    <script>
        setInterval(() => {
            var random = Math.random();
            if (random< 1/3) {
                document.getElementById("p3").style.backgroundColor = "yellow"
            }
            else if (random>2/3){
                document.getElementById("p3").style.backgroundColor = "magenta";
            }
            else {
              document.getElementById("p3").style.backgroundColor = "cyan";  
            }
    }, 3000)
        setInterval(()=> document.getElementById("p2").innerHTML = "The current date is: " + Date(),
        10000)
        setInterval(()=> {
            var fontSize = parseFloat(window.getComputedStyle(document.getElementById("p1"), null).getPropertyValue('font-size'));
            var random2 = Math.random();
            if (random2<0.5){
                document.getElementById("p1").style.fontSize = (fontSize * 2) + "px";
            } else {
                document.getElementById("p1").style.fontSize = (fontSize / 2) + "px";
            }
        }
        ,5000)
    </script>
</html>
